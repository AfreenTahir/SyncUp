name: Apply same Wi-Fi update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply packaged update
        shell: pwsh
        run: |
          Expand-Archive -Path same-wifi-update-v2.zip -DestinationPath . -Force
          Remove-Item -LiteralPath same-wifi-update-v2.zip
          Remove-Item -LiteralPath .github/workflows/apply-local-update.yml

      - name: Commit updated application
        shell: bash
        run: |
          git config user.name "Afreen Tahir"
          git config user.email "AfreenTahir@users.noreply.github.com"
          git add -A
          git commit -m "Add same Wi-Fi standalone mode"
          git push

[package]
name = "syncup-host"
version = "0.1.0"
description = "SyncUp desktop host"
authors = ["SyncUp"]
edition = "2021"

[lib]
name = "syncup_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
syncup-game-server = { path = "../../../services/game-server" }

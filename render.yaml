services:
  - type: web
    name: syncup-server-afreentahir
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: SYNCUP_BIND
        value: 0.0.0.0:10000
      - key: SYNCUP_ENV
        value: production
      - key: SYNCUP_ALLOWED_ORIGINS
        value: https://syncup-play-afreentahir.onrender.com,https://syncup-host-afreentahir.onrender.com
      - key: SYNCUP_PUBLIC_URL
        value: https://syncup-server-afreentahir.onrender.com
      - key: RUST_LOG
        value: syncup_game_server=info,tower_http=info

  - type: web
    name: syncup-play-afreentahir
    runtime: static
    buildCommand: npm ci && npm run build --workspace @syncup/player-web
    staticPublishPath: ./apps/player-web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://syncup-server-afreentahir.onrender.com
      - key: VITE_WS_URL
        value: wss://syncup-server-afreentahir.onrender.com/api/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: syncup-host-afreentahir
    runtime: static
    buildCommand: npm ci && npm run build --workspace @syncup/host-desktop
    staticPublishPath: ./apps/host-desktop/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://syncup-server-afreentahir.onrender.com
      - key: VITE_WS_URL
        value: wss://syncup-server-afreentahir.onrender.com/api/ws
      - key: VITE_PLAYER_WEB_URL
        value: https://syncup-play-afreentahir.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
